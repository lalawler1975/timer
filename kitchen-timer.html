<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kitchen Timer</title>
<style>
  :root {
    --bg: #101418;
    --fg: #f5f5f5;
    --accent: #3ba55d;
    --accent2: #2b7a45;
    --danger: #d9453e;
    --panel: #1c2229;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    transition: background-color 0.1s linear;
  }

  /* ---- Setup screen ---- */
  #setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
    width: 100%;
    padding: 3vh 4vw;
  }
  #setup h1 {
    font-size: clamp(20px, 4vw, 40px);
    margin: 0 0 1vh 0;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #9fb3c8;
  }
  .presets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3vw;
    width: 100%;
  }
  .preset-btn {
    flex: 1 1 18%;
    min-width: 130px;
    max-width: 220px;
    aspect-ratio: 1 / 1;
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 700;
    color: var(--fg);
    background: var(--panel);
    border: 3px solid #2f3944;
    border-radius: 24px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .preset-btn small {
    font-size: 0.32em;
    font-weight: 500;
    color: #9fb3c8;
    margin-top: 0.3em;
  }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn:active { transform: scale(0.94); background: var(--accent2); }

  .custom-row {
    display: flex;
    align-items: center;
    gap: 2vw;
    margin-top: 2vh;
    flex-wrap: wrap;
    justify-content: center;
  }
  #customMinutes {
    font-size: clamp(24px, 4vw, 40px);
    width: 5em;
    text-align: center;
    padding: 0.3em 0.2em;
    border-radius: 14px;
    border: 3px solid #2f3944;
    background: var(--panel);
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  #customMinutes:focus { outline: none; border-color: var(--accent); }
  .custom-label { font-size: clamp(16px, 2.4vw, 24px); color: #9fb3c8; }
  #startCustom {
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 700;
    padding: 0.5em 1.4em;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #startCustom:active { background: var(--accent2); transform: scale(0.96); }

  /* ---- Running screen ---- */
  #running {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #clock {
    font-size: min(32vw, 42vh);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    font-family: "Courier New", Consolas, monospace;
  }
  #clockLabel {
    font-size: clamp(18px, 3vw, 34px);
    color: #9fb3c8;
    margin-top: 1vh;
  }
  #cancelBtn {
    position: fixed;
    top: 3vh;
    right: 3vw;
    font-size: clamp(14px, 1.8vw, 20px);
    background: var(--panel);
    color: #9fb3c8;
    border: 2px solid #2f3944;
    border-radius: 10px;
    padding: 0.6em 1em;
    cursor: pointer;
  }

  /* ---- Alarm screen ---- */
  #alarm {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    cursor: pointer;
    text-align: center;
    padding: 4vw;
  }
  #alarmTitle {
    font-size: min(16vw, 18vh);
    font-weight: 800;
    line-height: 1;
  }
  #alarmSub {
    font-size: clamp(20px, 3.5vw, 40px);
    margin-top: 3vh;
    font-weight: 600;
  }
  #alarmTap {
    font-size: clamp(16px, 2.4vw, 26px);
    margin-top: 4vh;
    opacity: 0.85;
  }

  body.flash {
    animation: flashbg 0.5s steps(1) infinite;
  }
  @keyframes flashbg {
    0%, 49% { background-color: var(--danger); }
    50%, 100% { background-color: #1a0605; }
  }
  body.flash #alarmTitle,
  body.flash #alarmSub,
  body.flash #alarmTap { color: #fff; }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="setup">
    <h1>Kitchen Timer</h1>
    <div class="presets">
      <button class="preset-btn" data-min="3">3<small>MIN</small></button>
      <button class="preset-btn" data-min="5">5<small>MIN</small></button>
      <button class="preset-btn" data-min="10">10<small>MIN</small></button>
      <button class="preset-btn" data-min="30">30<small>MIN</small></button>
    </div>
    <div class="custom-row">
      <input id="customMinutes" type="number" min="0.1" step="0.5" placeholder="7" inputmode="decimal">
      <span class="custom-label">minutes</span>
      <button id="startCustom">Start</button>
    </div>
  </div>

  <div id="running">
    <button id="cancelBtn">Cancel</button>
    <div id="clock">00:00</div>
    <div id="clockLabel">remaining &mdash; tap anywhere to cancel</div>
  </div>

  <div id="alarm">
    <div id="alarmTitle">TIME'S UP</div>
    <div id="alarmSub" id="alarmSubText"></div>
    <div id="alarmTap">tap anywhere to stop</div>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "kitchenTimer.endTime";

  var setupEl = document.getElementById("setup");
  var runningEl = document.getElementById("running");
  var alarmEl = document.getElementById("alarm");
  var clockEl = document.getElementById("clock");
  var alarmSubEl = document.getElementById("alarmSub");
  var customMinutesEl = document.getElementById("customMinutes");

  var tickHandle = null;
  var audioCtx = null;
  var chimeHandle = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function formatDuration(totalSeconds) {
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    if (h > 0) return h + ":" + pad(m) + ":" + pad(s);
    return pad(m) + ":" + pad(s);
  }

  function formatElapsed(totalSeconds) {
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    var parts = [];
    if (h > 0) parts.push(h + "h");
    if (m > 0 || h > 0) parts.push(m + "m");
    parts.push(s + "s");
    return parts.join(" ");
  }

  function showScreen(name) {
    setupEl.style.display = name === "setup" ? "flex" : "none";
    runningEl.style.display = name === "running" ? "flex" : "none";
    alarmEl.style.display = name === "alarm" ? "flex" : "none";
  }

  function saveEndTime(endTime) {
    try { localStorage.setItem(STORAGE_KEY, String(endTime)); } catch (e) {}
  }

  function clearEndTime() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function readEndTime() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (!v) return null;
      var n = parseInt(v, 10);
      return isNaN(n) ? null : n;
    } catch (e) { return null; }
  }

  function startTimer(minutes) {
    var ms = Math.round(minutes * 60 * 1000);
    if (ms <= 0) return;
    var endTime = Date.now() + ms;
    saveEndTime(endTime);
    enterRunning(endTime);
  }

  function enterRunning(endTime) {
    showScreen("running");
    tick(endTime);
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(function () { tick(endTime); }, 250);
  }

  function tick(endTime) {
    var remainingMs = endTime - Date.now();
    if (remainingMs <= 0) {
      clearInterval(tickHandle);
      tickHandle = null;
      enterAlarm(0);
      return;
    }
    clockEl.textContent = formatDuration(remainingMs / 1000);
  }

  function enterAlarm(missedBySeconds) {
    showScreen("alarm");
    document.body.classList.add("flash");
    if (missedBySeconds > 0) {
      alarmSubEl.textContent = "It finished " + formatElapsed(missedBySeconds) + " ago, while this page was closed.";
    } else {
      alarmSubEl.textContent = "";
    }
    startChime();
  }

  function stopAlarmAndReset() {
    document.body.classList.remove("flash");
    stopChime();
    clearEndTime();
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    showScreen("setup");
  }

  /* --- Audio: repeating loud beep, generated with Web Audio API, no files needed --- */
  function ensureAudioCtx() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
    return audioCtx;
  }

  function beep(freq, startAt, duration, gainValue) {
    var ctx = audioCtx;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(gainValue, startAt + 0.01);
    gain.gain.setValueAtTime(gainValue, startAt + duration - 0.03);
    gain.gain.linearRampToValueAtTime(0, startAt + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + duration);
  }

  function playChimeBurst() {
    try {
      var ctx = ensureAudioCtx();
      var now = ctx.currentTime + 0.02;
      beep(988, now, 0.16, 0.35);
      beep(988, now + 0.22, 0.16, 0.35);
      beep(1319, now + 0.44, 0.28, 0.4);
    } catch (e) {}
  }

  function startChime() {
    stopChime();
    playChimeBurst();
    chimeHandle = setInterval(playChimeBurst, 1500);
  }

  function stopChime() {
    if (chimeHandle) { clearInterval(chimeHandle); chimeHandle = null; }
  }

  /* --- Wiring --- */
  document.querySelectorAll(".preset-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      ensureAudioCtx();
      startTimer(parseFloat(btn.getAttribute("data-min")));
    });
  });

  document.getElementById("startCustom").addEventListener("click", function () {
    ensureAudioCtx();
    var v = parseFloat(customMinutesEl.value);
    if (!isNaN(v) && v > 0) startTimer(v);
  });

  customMinutesEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("startCustom").click();
  });

  runningEl.addEventListener("click", function () {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    clearEndTime();
    showScreen("setup");
  });
  document.getElementById("cancelBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    clearEndTime();
    showScreen("setup");
  });

  alarmEl.addEventListener("click", stopAlarmAndReset);
  document.addEventListener("keydown", function (e) {
    if (alarmEl.style.display === "flex" && (e.key === " " || e.key === "Enter" || e.key === "Escape")) {
      stopAlarmAndReset();
    }
  });

  /* --- Resume on load: read the stored end time, not a countdown counter,
     so it survives the page/tab being fully closed. --- */
  function init() {
    var endTime = readEndTime();
    if (endTime === null) {
      showScreen("setup");
      return;
    }
    var remainingMs = endTime - Date.now();
    if (remainingMs > 0) {
      enterRunning(endTime);
    } else {
      var missedBySeconds = (Date.now() - endTime) / 1000;
      enterAlarm(missedBySeconds);
    }
  }

  init();
})();
</script>
</body>
</html>
